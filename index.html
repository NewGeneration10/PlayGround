function makeCombatant(f,x){return {fighter:fighterWithCosmetics(f),x,y:0,hp:100,meter:0,pose:'idle',vy:0,stun:0,attack:0,cool:0,hitFlash:0,guard:false,combo:0,aiThink:0,aiGuard:0}}
function startMatch(){document.getElementById('controls').classList.remove('hidden');held.clear();document.querySelectorAll('[data-control]').forEach(el=>el.classList.remove('active'));let player=byId(selectedFighter);if(!player||!save.unlockedFighters.includes(player.id)){toast('Choose an unlocked fighter first');fightersScreen();return}let choices=roster.filter(f=>f.id!==player.id&&save.unlockedFighters.includes(f.id));let enemy=championship?opponentForTour():choices[Math.floor(Math.random()*choices.length)]||byId('bruno');let diff=save.settings.difficulty;activeMatch={arena:selectedArena,player:makeCombatant(player,W*.34),enemy:makeCombatant(enemy,W*.66),difficulty:diff,keys:{},aiAction:0,aiThink:0,aiGuard:0,perfect:true,roundsLost:0};round=1;pWins=0;eWins=0;elapsed=60;matchEnded=false;rewardsPaid=false;mode='fight';document.getElementById('mainUI').classList.add('hidden');document.getElementById('shade').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('matchresult').classList.add('hidden');document.getElementById('arenaCaption').textContent=arenas[selectedArena].name.toUpperCase();setText('pname',player.name);setText('ename',enemy.name);updateHUD();applyControlSettings();announce(championship?`CHAMPIONSHIP · ${tournamentIndex+1}`:'ROUND 1');lastT=performance.now()}
function setText(id,text){document.getElementById(id).textContent=text}
function updateHUD(){if(!activeMatch)return;let p=activeMatch.player,e=activeMatch.enemy;document.getElementById('php').style.width=Math.max(0,p.hp)+'%';document.getElementById('ehp').style.width=Math.max(0,e.hp)+'%';document.getElementById('pmeter').style.width=p.meter+'%';document.getElementById('emeter').style.width=e.meter+'%';setText('timer',Math.ceil(elapsed));setText('pround',pWins);setText('eround',eWins);setText('roundinfo',`ROUND ${round} · FIRST TO 2`)}
function announce(text){let el=document.getElementById('message');el.textContent=text;el.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>el.classList.remove('show'),1050)}
function toast(text){let n=document.getElementById('notice');n.textContent=text;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1800)}
function applyControlSettings(){const c=document.getElementById('controls'),dpad=c.querySelector('.dpad'),actions=c.querySelector('.actions'),requested=save.settings.control,baseWidth=(dpad?.offsetWidth||0)+(actions?.offsetWidth||0),available=c.clientWidth,scale=baseWidth?Math.min(requested,available/baseWidth):requested;c.style.setProperty('--control-scale',scale);c.style.opacity=save.settings.opacity;c.style.transform='';if(dpad){dpad.style.transform=`scale(${scale})`;dpad.style.transformOrigin='bottom left'}if(actions){actions.style.transform=`scale(${scale})`;actions.style.transformOrigin='bottom right'}}
window.addEventListener('resize',applyControlSettings);
const held=new Set(),controlMap={a:'left',arrowleft:'left',d:'right',arrowright:'right',w:'up',arrowup:'up',s:'down',arrowdown:'down',j:'punch',k:'kick',l:'block',i:'special',u:'special'};
function setControl(control,on){if(on)held.add(control);else held.delete(control);document.querySelectorAll(`[data-control="${control}"]`).forEach(el=>el.classList.toggle('active',on))}
function attack(fighter,type){if(fighter.cool>0||fighter.stun>0)return;if(type==='special'&&fighter.meter<100){toast('Build your meter with attacks');return}if(type==='special')fighter.meter=0;fighter.attack=type==='special'?32:type==='kick'?24:18;fighter.cool=type==='special'?1.15:type==='kick'?.58:.42;fighter.pose=type;fighter.guard=false;playTone(type==='special'?170:type==='kick'?240:310,.08);let m=activeMatch,enemy=fighter===m.player?m.enemy:m.player;let distance=Math.abs(enemy.x-fighter.x),reach=type==='special'?235:type==='kick'?132:105;if(distance<=reach){let power=fighter.fighter.stats[1],strength=(type==='special'?23:type==='kick'?10:7)*(0.72+power/160);if(enemy.guard){strength*=.2;enemy.meter=Math.min(100,enemy.meter+5)}else{strength*=1-enemy.fighter.stats[2]/260;enemy.stun=type==='special'?.32:.18;enemy.pose='hit';enemy.hitFlash=.14}enemy.hp=Math.max(0,enemy.hp-strength);fighter.meter=Math.min(100,fighter.meter+(type==='special'?0:13));fighter.combo++;fighter.lastHit=performance.now();if(fighter.combo>=3)announce(`${fighter.combo} HIT COMBO!`);if(type==='special')announce(fighter.fighter.move.toUpperCase());playTone(enemy.guard?130:85,.1)}else fighter.combo=0}
function controlPlayer(dt){let p=activeMatch.player,move=(held.has('right')?1:0)-(held.has('left')?1:0),speed=225*(.75+p.fighter.stats[3]/200);p.x=Math.max(50,Math.min(W-50,p.x+move*speed*dt));p.guard=held.has('block')&&p.attack<=0&&p.stun<=0;if(held.has('up')&&p.y===0&&p.stun<=0)p.vy=-480;if(held.has('down')&&p.y===0)p.pose='crouch';else if(p.guard)p.pose='block';else if(!p.attack&&!p.stun)p.pose=move?'walk':'idle';if(p.vy!==0){p.vy+=1250*dt;p.y=(p.y||0)+p.vy*dt;if(p.y>=0){p.y=0;p.vy=0}}if(p.vy!==0)p.pose='jump';if(p.guard&&!p.attack)p.pose='block';if(held.has('punch'))attack(p,'punch');else if(held.has('kick'))attack(p,'kick');else if(held.has('special'))attack(p,'special')}
function controlAI(dt){let m=activeMatch,e=m.enemy,p=m.player,dist=p.x-e.x,abs=Math.abs(dist),difficulty=m.difficulty,brain=difficulty==='easy'?.55:difficulty==='hard'?1.12:.85,speed=(112+e.fighter.stats[3]*.58)*brain,face=dist>=0?1:-1;const clamp=()=>{e.x=Math.max(50,Math.min(W-50,e.x))};if(e.stun>0){e.guard=false;return}e.aiThink-=dt;const threat=p.attack>0&&abs<175&&p.y===0,guardChance=difficulty==='easy'?.18:difficulty==='hard'?.78:.52;if(threat&&Math.random()<guardChance*dt*9){e.guard=true;e.pose='block';e.aiGuard=.18+Math.random()*.22}else if(e.aiGuard>0){e.aiGuard-=dt;e.guard=true;e.pose='block'}else{e.guard=false;let target=88+((e.fighter.stats[3]%5)*3);if(abs>target+20){e.x+=Math.sign(dist||face)*speed*dt;e.pose=e.attack?'walk':'run'}else if(abs<target-15&&p.attack<=0){e.x-=Math.sign(dist||face)*speed*.42*dt;e.pose='walk'}else if(!e.attack)e.pose='idle';clamp();if(e.aiThink<=0){e.aiThink=(difficulty==='hard'?.34:difficulty==='easy'?.82:.55)+Math.random()*(difficulty==='hard'?.28:.42);let range= difficulty==='hard'?190:155;if(abs<range){let r=Math.random(),playerRecover=p.cool>0||p.stun>0;if(e.meter>=100&&((difficulty==='hard'&&r<.24)||(difficulty==='normal'&&r<.12)))attack(e,'special');else if(threat&&r<(difficulty==='hard'?.5:.23)){e.aiGuard=.28;e.guard=true;e.pose='block'}else if(playerRecover||r<(difficulty==='easy'?.48:difficulty==='hard'?.91:.78))attack(e,r<(difficulty==='hard'?.42:.35)?'punch':'kick');else if(difficulty!=='easy'&&p.y<0){e.guard=true;e.pose='block'}else if(abs<105&&r>.82){e.x-=Math.sign(dist||face)*speed*.7*dt;clamp()}}}}}
function updateFighter(f,dt){f.cool=Math.max(0,f.cool-dt);f.attack=Math.max(0,f.attack-dt*60);f.stun=Math.max(0,f.stun-dt);f.hitFlash=Math.max(0,f.hitFlash-dt);if(f.attack<=0&&f.stun<=0&&!f.guard&&!['walk','jump','crouch'].includes(f.pose))f.pose='idle';if(f.lastHit&&performance.now()-f.lastHit>800)f.combo=0}
function endRound(){let p=activeMatch.player,e=activeMatch.enemy;if(p.hp===e.hp){p.hp=Math.max(1,p.hp);e.hp=Math.max(1,e.hp)}if(p.hp>=e.hp){pWins++;announce('ROUND YOURS!')}else{eWins++;activeMatch.roundsLost++;activeMatch.perfect=false;announce('ROUND LOST')}if(pWins>=2||eWins>=2){finishMatch(pWins>eWins);return}round++;elapsed=60;p.hp=100;e.hp=100;p.meter=Math.min(100,p.meter+25);e.meter=Math.min(100,e.meter+20);p.x=W*.34;e.x=W*.66;p.attack=e.attack=0;p.stun=e.stun=0;p.cool=e.cool=0;p.guard=e.guard=false;setTimeout(()=>{if(mode==='fight'&&!matchEnded)announce(`ROUND ${round} · FIGHT!`)},800);updateHUD()}
function finishMatch(won){if(matchEnded)return;matchEnded=true;if(activeMatch){for(const fighter of [activeMatch.player,activeMatch.enemy]){fighter.attack=0;fighter.stun=0;fighter.guard=false;fighter.y=0;fighter.vy=0}activeMatch.player.pose=won?'victory':'defeat';activeMatch.enemy.pose=won?'defeat':'victory'}let reward=won?(championship?250:120):35;if(won){save.wins++;if(championship){tournamentIndex++;if(tournamentIndex>=6){save.champion=true;save.boss=true;if(!save.unlockedArenas.includes(5))save.unlockedArenas.push(5);if(!save.unlockedArenas.includes(6))save.unlockedArenas.push(6)}}}save.coins+=reward;unlockArenaProgress();persist();const result=document.getElementById('matchresult');let next=championship&&won&&tournamentIndex<6?`<button class="btn primary" data-action="tour-next">Next challenger</button>`:'';let title=won?'VICTORY!':'DEFEAT';result.innerHTML=`<div class="resultbox"><div class="eyebrow">${championship?'CHAMPIONSHIP':'QUICK FIGHT'} · ${won?'WIN':'LOSS'}</div><h2>${title}</h2><p>${won?'The streets remember your name.':'Train up and come back stronger.'}</p><p class="coin">+${reward} LEGEND COINS</p>${championship&&won?`<p>Championship bout ${Math.min(tournamentIndex,6)} of 6</p>`:''}<div class="panelactions" style="justify-content:center">${next}<button class="btn" data-action="rematch">Rematch</button><button class="btn" data-action="home">Main menu</button></div></div>`;result.classList.remove('hidden');document.getElementById('controls').classList.add('hidden')}
function gameLoop(now){requestAnimationFrame(gameLoop);let dt=Math.min(.04,(now-lastT)/1000||0);lastT=now;anim+=dt*60;if(mode!=='fight'||!activeMatch||matchEnded)return;elapsed-=dt;let p=activeMatch.player,e=activeMatch.enemy;controlPlayer(dt);controlAI(dt);updateFighter(p,dt);updateFighter(e,dt);let gap=e.x-p.x;if(Math.abs(gap)<56){let direction=gap===0?(activeMatch.lastFacing||1):Math.sign(gap),mid=(p.x+e.x)/2;p.x=mid-direction*28;e.x=mid+direction*28;let shift=p.x<50?50-p.x:e.x>W-50?W-50-e.x:0;if(shift){p.x+=shift;e.x+=shift}activeMatch.lastFacing=direction}if(p.hp<=0||e.hp<=0||elapsed<=0){if(elapsed<=0)elapsed=0;endRound()}updateHUD()}
requestAnimationFrame(gameLoop);
function playTone(freq,duration){if(!save.settings.sfx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!window.audioCtx)window.audioCtx=new AC();let c=window.audioCtx,o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration)}catch{}}
function shopItems(){return {outfits:roster.flatMap(f=>[{id:`${f.id}-street`,fighter:f.id,name:`${f.name} · Street alt`,price:1000,type:'outfit'},{id:`${f.id}-legend`,fighter:f.id,name:`${f.name} · Legend`,price:2500,type:'outfit'}]),accessories:[{id:'red-gloves',price:500,type:'accessory'},{id:'gold-boots',price:750,type:'accessory'},{id:'star-headband',price:800,type:'accessory'},{id:'shadow-mask',price:900,type:'accessory'}],finishers:roster.map(f=>({id:`${f.id}-finisher`,fighter:f.id,price:5000,type:'finisher'}))}[shopCategory]||[]}
function act(action){switch(action){case'play':startQuick();break;case'championship':if(!save.unlockedFighters.includes(selectedFighter)){selectedFighter='kenji'}beginChampionship();break;case'fighters':fightersScreen();break;case'arenas':arenaScreen();break;case'shop':shopCategory='outfits';selectedItem=null;shopScreen();break;case'settings':settingsScreen();break;case'back':showHome();break;case'fighter-confirm':showHome();toast(`${byId(selectedFighter).name} selected`);break;case'arena-confirm':if(save.unlockedArenas.includes(selectedArena))startQuick();else toast('Win more fights to unlock this arena');break;case'settings-save':save.settings.difficulty=document.getElementById('difficulty').value;save.settings.time=document.getElementById('time').value;save.settings.control=Number(document.getElementById('controlSize').value);save.settings.opacity=Number(document.getElementById('controlOpacity').value);persist();applyControlSettings();toast('Settings saved');showHome();break;case'music':save.settings.music=!save.settings.music;persist();settingsScreen();break;case'sfx':save.settings.sfx=!save.settings.sfx;persist();settingsScreen();break;case'shop-buy':{let it=shopItems().find(x=>x.id===selectedItem);if(!it){toast('Select an item first');break}if(save.owned.includes(it.id)){toast('Already owned');break}if(save.coins<it.price){toast('Not enough Legend Coins');break}save.coins-=it.price;save.owned.push(it.id);persist();shopScreen();toast('Purchase complete');break}case'shop-equip':{if(!selectedItem||!save.owned.includes(selectedItem)){toast('Purchase this item first');break}let it=shopItems().find(x=>x.id===selectedItem);if(it?.type==='accessory'){if(save.equipped.accessory===it.id)delete save.equipped.accessory;else save.equipped.accessory=it.id}else if(it?.fighter&&it.type==='outfit'){if(save.equipped[it.fighter]===it.id)delete save.equipped[it.fighter];else save.equipped[it.fighter]=it.id}else{toast('This collectible has no combat effect yet');break}persist();sh document.addEventListener('click',e=>{let action=e.target.closest('[data-action]')?.dataset.action;if(action){act(action);return}let f=e.target.closest('[data-fighter]');if(f){let id=f.dataset.fighter,def=byId(id);if(save.unlockedFighters.includes(id)){selectedFighter=id;fightersScreen()}else if(def&&save.coins>=def.unlock){save.coins-=def.unlock;save.unlockedFighters.push(id);selectedFighter=id;persist();fightersScreen();toast(`${def.name} unlocked!`)}else toast('Not enough Legend Coins');return}let a=e.target.closest('[data-arena]');if(a){let i=Number(a.dataset.arena);if(save.unlockedArenas.includes(i)){selectedArena=i;arenaScreen()}else toast('This arena is still locked');return}let cat=e.target.closest('[data-category]');if(cat){shopCategory=cat.dataset.category;selectedItem=null;shopScreen();return}let item=e.target.closest('[data-item]');if(item){selectedItem=item.dataset.item;shopScreen()}});

addEventListener('keydown',e=>{let c=controlMap[e.key.toLowerCase()];if(c){e.preventDefault();if(!held.has(c)){setControl(c,true);if(c==='up')setTimeout(()=>setControl('up',false),150)}}if(e.key==='Escape'&&mode==='fight')showHome()});addEventListener('keyup',e=>{let c=controlMap[e.key.toLowerCase()];if(c)setControl(c,false)});

showHome();document.getElementById('audioQuick').textContent=save.settings.music?'♫ ON':'♫ OFF';
</script></body></html>
